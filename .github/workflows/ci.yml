name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Every substantive `run:` step in this workflow MUST dispatch through
# scripts/Invoke-CiGate.ps1 with a -Id that exists in governance/ci-gates.json.
# Setup steps (checkout, language installs, dependency installs) are exempt.
# LocalGateParityTests (in tests/Architecture.Tests/) enforces the contract.

jobs:
  spec-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
        # No `cache: pnpm` here — setup-node's cache resolution runs before
        # corepack has installed pnpm, so requesting a pnpm cache on a fresh
        # runner fails with "Unable to locate executable file: pnpm". The
        # `Enable Corepack` step below installs pnpm immediately after this
        # step, and the frontend workspace install pulls from the registry.

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          Push-Location web
          pnpm install --frozen-lockfile
          Pop-Location

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          Push-Location web
          pnpm exec playwright install --with-deps chromium
          Pop-Location

      - name: Validate governance assets
        shell: pwsh
        run: ./scripts/Invoke-CiGate.ps1 -Id spec-governance

  dependency-policy:
    runs-on: ubuntu-latest
    needs: spec-governance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate dependency allowlists
        shell: pwsh
        run: ./scripts/Invoke-CiGate.ps1 -Id dependency-policy

  secret-scan:
    runs-on: ubuntu-latest
    needs: spec-governance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history required so gitleaks can inspect every commit that
          # shipped on this branch, not just the PR tip.
          fetch-depth: 0

      - name: Scan for leaked secrets
        shell: pwsh
        run: ./scripts/Invoke-CiGate.ps1 -Id secret-scan

  build:
    runs-on: ubuntu-latest
    needs:
      - spec-governance
      - dependency-policy
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: baseline
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --dbname baseline --username postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__BaselineDatabase: Host=127.0.0.1;Port=5432;Database=baseline;Username=postgres;Password=postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and build backend
        shell: pwsh
        run: ./scripts/Invoke-CiGate.ps1 -Id build

      - name: Verify whitespace formatting
        shell: pwsh
        run: ./scripts/Invoke-CiGate.ps1 -Id format-check

      - name: Smoke test DbMigrator bootstrap
        shell: pwsh
        run: ./scripts/Invoke-CiGate.ps1 -Id dbmigrator-smoke

  dependency-vulnerability-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Scan for known vulnerabilities (transitive included)
        shell: pwsh
        run: ./scripts/Invoke-CiGate.ps1 -Id dependency-vulnerability-scan

  backend-unit-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run backend unit tests
        shell: pwsh
        run: ./scripts/Invoke-CiGate.ps1 -Id backend-unit-tests

  architecture-tests:
    runs-on: ubuntu-latest
    needs: spec-governance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run architecture tests
        shell: pwsh
        run: ./scripts/Invoke-CiGate.ps1 -Id architecture-tests

      - name: Upload handler coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handler-coverage
          path: artifacts/handler-coverage.json
          if-no-files-found: error

  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run integration tests
        shell: pwsh
        run: ./scripts/Invoke-CiGate.ps1 -Id integration-tests

  apihost-missing-configuration-smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run ApiHost missing-configuration smoke
        shell: pwsh
        run: ./scripts/Invoke-CiGate.ps1 -Id apihost-missing-configuration-smoke

  apihost-missing-migrations-smoke:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: baseline
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --dbname baseline --username postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__BaselineDatabase: Host=127.0.0.1;Port=5432;Database=baseline;Username=postgres;Password=postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run ApiHost fail-fast smoke against PostgreSQL
        shell: pwsh
        run: ./scripts/Invoke-CiGate.ps1 -Id apihost-missing-migrations-smoke

  apihost-bootstrap-smoke:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: baseline
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --dbname baseline --username postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__BaselineDatabase: Host=127.0.0.1;Port=5432;Database=baseline;Username=postgres;Password=postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run ApiHost bootstrap smoke against PostgreSQL
        shell: pwsh
        run: ./scripts/Invoke-CiGate.ps1 -Id apihost-bootstrap-smoke

  contract-generation-and-compatibility:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: baseline
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --dbname baseline --username postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__BaselineDatabase: Host=127.0.0.1;Port=5432;Database=baseline;Username=postgres;Password=postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
        # pnpm is installed internally by Generate-Contracts.ps1 via corepack;
        # no explicit Enable Corepack step is needed in this job.

      - name: Run contract checks
        shell: pwsh
        run: ./scripts/Invoke-CiGate.ps1 -Id contract-generation-and-compatibility

  frontend-quality:
    runs-on: ubuntu-latest
    needs: contract-generation-and-compatibility
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
        # No `cache: pnpm` here — setup-node's cache resolution runs before
        # corepack has installed pnpm, so requesting a pnpm cache on a fresh
        # runner fails with "Unable to locate executable file: pnpm". The
        # `Enable Corepack` step below installs pnpm immediately after this
        # step, and the frontend workspace install pulls from the registry.

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          Push-Location web
          pnpm install --frozen-lockfile
          Pop-Location

      - name: Run frontend lint
        shell: pwsh
        run: ./scripts/Invoke-CiGate.ps1 -Id frontend-lint

      - name: Run frontend typecheck
        shell: pwsh
        run: ./scripts/Invoke-CiGate.ps1 -Id frontend-typecheck

      - name: Run frontend production build
        shell: pwsh
        run: ./scripts/Invoke-CiGate.ps1 -Id frontend-build

  frontend-unit-tests:
    runs-on: ubuntu-latest
    needs: frontend-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
        # No `cache: pnpm` here — setup-node's cache resolution runs before
        # corepack has installed pnpm, so requesting a pnpm cache on a fresh
        # runner fails with "Unable to locate executable file: pnpm". The
        # `Enable Corepack` step below installs pnpm immediately after this
        # step, and the frontend workspace install pulls from the registry.

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          Push-Location web
          pnpm install --frozen-lockfile
          Pop-Location

      - name: Run frontend unit tests
        shell: pwsh
        run: ./scripts/Invoke-CiGate.ps1 -Id frontend-unit-tests

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: frontend-unit-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: baseline
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --dbname baseline --username postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__BaselineDatabase: Host=127.0.0.1;Port=5432;Database=baseline;Username=postgres;Password=postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
        # No `cache: pnpm` here — setup-node's cache resolution runs before
        # corepack has installed pnpm, so requesting a pnpm cache on a fresh
        # runner fails with "Unable to locate executable file: pnpm". The
        # `Enable Corepack` step below installs pnpm immediately after this
        # step, and the frontend workspace install pulls from the registry.

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          Push-Location web
          pnpm install --frozen-lockfile
          Pop-Location

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          Push-Location web
          pnpm exec playwright install --with-deps chromium
          Pop-Location

      - name: Run frontend end-to-end tests
        shell: pwsh
        run: ./scripts/Invoke-CiGate.ps1 -Id frontend-e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-and-traces
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
