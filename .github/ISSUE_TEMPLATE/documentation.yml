name: Documentation improvement
description: Report missing, incorrect, or unclear documentation.
title: "[Docs]: "
body:
  - type: input
    id: location
    attributes:
      label: Affected file or section
      placeholder: README.md, docs/ADD_MODULE.md, KnowledgeBase README, etc.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
    validations:
      required: false